name: Legacy private trading launch (disabled)

# Intentionally retained as a visible fail-closed tombstone. The former workflow
# mixed mutable web, Render, and Phala changes, generated rotating credentials,
# and referenced a stale worker image. Investor releases must follow the guarded
# exact-artifact procedure in docs/WORKER-DEPLOY-RUNBOOK.md and require explicit
# human approval before any paid build, provision, or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy launch
        run: |
          echo "::error::This legacy launch path is permanently disabled. Use the exact-artifact guarded release runbook."
          exit 1
